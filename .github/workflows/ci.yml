name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-ci:
    name: Backend (alembic + tests)
    runs-on: ubuntu-latest

    # Make the repo root importable as `app.*` for Alembic & tests
    env:
      PYTHONPATH: ${{ github.workspace }}
      MCP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    # Exercise real PostgreSQL visibility, rollback and migration tests instead
    # of silently skipping the MCP transaction checks on a SQLite-only runner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Ensure alembic is available even if it's not in requirements.txt
          python -m pip install alembic
          # Test deps
          python -m pip install pytest pytest-cov httpx freezegun factory_boy faker

      - name: Show environment (debug)
        run: |
          python -V
          python -c "import sys; print('PYTHONPATH:', sys.path)"
          python -c "import fastapi, sqlalchemy; print('FastAPI', fastapi.__version__, 'SQLAlchemy', sqlalchemy.__version__)"

      - name: Alembic upgrade (create/update DB)
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini heads

      - name: Run tests
        run: |
          # Scope to tests/ to avoid wandering into system dirs
          python -m pytest -q tests
